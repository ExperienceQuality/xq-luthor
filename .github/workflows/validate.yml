# Contract validation gate (Task 8): lint contracts + regeneration-diff check.
# Any contract change must ship with its regenerated output in the same PR —
# this workflow fails when they diverge (see docs/contracts-conventions.md).
name: validate

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
        # Maven is preinstalled on ubuntu-latest; gen-db-java.sh falls back to
        # tools/apache-maven-3.9.16/bin/mvn when mvn is absent.

      - name: Log in to ghcr.io (codegen images)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run contract validation gate
        run: ./scripts/validate.sh
