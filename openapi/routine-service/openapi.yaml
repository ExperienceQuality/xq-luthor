openapi: 3.1.0
info:
  title: Routine Service API
  version: 1.1.0
  description: >
    Multi-user workout routine management. Owns routines, ordered sessions,
    exercise prescriptions, and the two most recent routine snapshots.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Routines
  - name: Sessions
  - name: Snapshots
  - name: Exercise history
paths:
  /livez:
    get:
      tags: [Health]
      operationId: liveness
      security: []
      responses:
        '200': { description: Service is alive. }
  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      security: []
      responses:
        '200': { description: Service is ready. }
  /api/v1/routines:
    get:
      tags: [Routines]
      operationId: listRoutines
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Page of routines owned by the authenticated principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutinePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Routines]
      operationId: createRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutineCreate' }
      responses:
        '201':
          description: Routine created.
          headers:
            Location: { required: true, schema: { type: string, format: uri-reference } }
            ETag: { required: true, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/routines/{routineId}:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
    get:
      tags: [Routines]
      operationId: getRoutine
      responses:
        '200':
          description: Routine details.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Routines]
      operationId: updateRoutine
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/RoutinePatch' }
      responses:
        '200':
          description: Routine updated.
          headers:
            ETag: { required: true, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Routines]
      operationId: archiveRoutine
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Routine archived; children are retained. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/routines/{routineId}/sessions:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
    post:
      tags: [Sessions]
      operationId: addSession
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '201':
          description: Session created.
          headers:
            ETag: { required: true, schema: { type: string } }
            Location: { required: true, schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/routines/{routineId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sessions]
      operationId: replaceSession
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '200':
          description: Session replaced.
          headers:
            ETag: { required: true, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Sessions]
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Session deleted and remaining positions compacted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/routines/{routineId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
    get:
      tags: [Snapshots]
      operationId: listSnapshots
      responses:
        '200':
          description: Up to the two most recent snapshots, newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 2
                items: { $ref: '#/components/schemas/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Snapshots]
      operationId: captureSnapshot
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201':
          description: Snapshot captured; older snapshots beyond retention are pruned atomically.
          headers:
            ETag: { required: true, schema: { type: string } }
            Location: { required: true, schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/routines/{routineId}/snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
      - name: snapshotId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Snapshots]
      operationId: getSnapshot
      responses:
        '200':
          description: Snapshot details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/routines/{routineId}/exercise-records:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
    get:
      tags: [Exercise history]
      operationId: listSessionExerciseRecords
      description: >
        Reads the session definition and composes matching exercise logs from Exercise Service.
        The caller's delegated identity must be propagated to Exercise Service.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Exercise records matching the session's exercise references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseRecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: Exercise Service unavailable; Retry-After may be present.
          headers:
            Retry-After: { schema: { type: string } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoutineId:
      name: routineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
  schemas:
    RoutineCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    RoutinePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    Routine:
      type: object
      required: [id, name, version, createdAt, updatedAt, sessions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/Session' }
    RoutineListItem:
      type: object
      required: [id, name, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoutinePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RoutineListItem' }
        nextCursor: { type: [string, 'null'] }
    SessionWrite:
      type: object
      additionalProperties: false
      required: [name, position, exercises]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        position: { type: integer, minimum: 0 }
        exercises:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ExercisePrescription' }
    Session:
      type: object
      required: [id, name, position, exercises]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer, minimum: 0 }
        exercises:
          type: array
          items: { $ref: '#/components/schemas/ExercisePrescription' }
    ExercisePrescription:
      type: object
      additionalProperties: false
      required: [name, sets, repetitions, weightKg]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        sets: { type: integer, minimum: 1, maximum: 32767 }
        repetitions: { type: integer, minimum: 1, maximum: 32767 }
        weightKg: { type: number, minimum: 0, multipleOf: 0.01 }
    Snapshot:
      type: object
      required: [id, capturedAt, entries]
      properties:
        id: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: '#/components/schemas/SnapshotEntry' }
    SnapshotEntry:
      type: object
      required: [name, sets, repetitions, weightKg, repetitionsProgress, weightProgress]
      properties:
        name: { type: string }
        sets: { type: integer, minimum: 1 }
        repetitions: { type: integer, minimum: 1 }
        weightKg: { type: number, minimum: 0 }
        repetitionsProgress: { $ref: '#/components/schemas/Progress' }
        weightProgress: { $ref: '#/components/schemas/Progress' }
    Progress:
      type: string
      enum: [first, increased, decreased, same]
    ExerciseRecordPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExerciseRecord' }
        nextCursor: { type: [string, 'null'] }
    ExerciseRecord:
      type: object
      required: [id, exerciseName, loggedAt, sets, highestSetVolumeKg]
      properties:
        id: { type: integer, format: int64 }
        exerciseName: { type: string }
        loggedAt: { type: string, format: date-time }
        sets:
          type: array
          items:
            type: object
            required: [id, setNumber, weightKg, reps, volumeKg]
            properties:
              id: { type: integer, format: int64 }
              setNumber: { type: integer }
              weightKg: { type: number }
              reps: { type: integer }
              volumeKg: { type: number }
        highestSetVolumeKg: { type: number }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string }
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid, expired, or unacceptable access token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist or is not owned by the authenticated principal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Domain conflict, such as an archived routine.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: If-Match does not match the current routine version.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: Required If-Match header is missing.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: Downstream response was invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
