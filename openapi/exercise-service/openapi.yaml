openapi: 3.1.0
info:
  title: Exercise Service API
  version: 1.1.0
  description: Multi-user exercise log book. Owns actual performed exercise logs and sets.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/exercise-logs:
    post:
      operationId: createExerciseLog
      summary: Create an exercise log for the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExerciseLogRequest' }
      responses:
        '201':
          description: Exercise log created.
          headers:
            Location: { required: true, schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listExerciseLogs
      summary: List the authenticated user's exercise logs.
      parameters:
        - name: exerciseName
          in: query
          description: Case-insensitive exact exercise-name filter.
          schema: { type: string, minLength: 1 }
        - name: exerciseNames
          in: query
          description: Repeated query parameter; matches any supplied name case-insensitively.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items: { type: string, minLength: 1, maxLength: 120 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [loggedAt, highestSetVolume]
            default: loggedAt
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of exercise logs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/exercise-logs/exercises:
    get:
      operationId: listDistinctExercises
      summary: List distinct exercise names used by the authenticated user.
      responses:
        '200':
          description: Exercise usage summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExerciseSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/exercise-logs/{exerciseLogId}:
    parameters:
      - name: exerciseLogId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getExerciseLog
      summary: Get one exercise log owned by the authenticated user.
      responses:
        '200':
          description: Exercise log.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  schemas:
    CreateExerciseLogRequest:
      type: object
      additionalProperties: false
      required: [exerciseName, sets]
      properties:
        exerciseName:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '.*\S.*'
        loggedAt:
          type: string
          format: date-time
          description: Optional client-observed workout time. Server uses current time when omitted.
        sets:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ExerciseSetRequest' }
    ExerciseSetRequest:
      type: object
      additionalProperties: false
      required: [setNumber, weightKg, reps]
      properties:
        setNumber: { type: integer, minimum: 1, maximum: 32767 }
        weightKg: { type: number, minimum: 0, multipleOf: 0.01 }
        reps: { type: integer, minimum: 1, maximum: 32767 }
    ExerciseLog:
      type: object
      additionalProperties: false
      required: [id, exerciseName, loggedAt, sets, highestSetVolumeKg]
      properties:
        id: { type: integer, format: int64 }
        exerciseName: { type: string }
        loggedAt: { type: string, format: date-time }
        sets:
          type: array
          items: { $ref: '#/components/schemas/ExerciseSet' }
        highestSetVolumeKg:
          type: number
          description: Maximum weightKg multiplied by reps among the log's sets.
    ExerciseSet:
      type: object
      additionalProperties: false
      required: [id, setNumber, weightKg, reps, volumeKg]
      properties:
        id: { type: integer, format: int64 }
        setNumber: { type: integer }
        weightKg: { type: number }
        reps: { type: integer }
        volumeKg: { type: number }
    ExerciseLogPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExerciseLog' }
        nextCursor: { type: [string, 'null'] }
    ExerciseSummary:
      type: object
      additionalProperties: false
      required: [exerciseName, logCount, lastLoggedAt]
      properties:
        exerciseName: { type: string }
        logCount: { type: integer, minimum: 1 }
        lastLoggedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string }
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid, expired, or unacceptable access token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Exercise log does not exist or is not owned by the authenticated principal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
