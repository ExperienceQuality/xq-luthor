openapi: 3.1.0
info:
  title: Fitness BFF API
  version: 1.0.0
  description: >
    Miniapp-facing backend-for-frontend. Composes Routine Service and Exercise Service.
    Does not own or persist fitness domain data.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Return minimal authenticated principal information.
      responses:
        '200':
          description: Authenticated identity claims safe for client display.
          content:
            application/json:
              schema:
                type: object
                required: [subject]
                properties:
                  subject: { type: string }
                  displayName: { type: [string, 'null'] }
  /api/v1/routines:
    get:
      operationId: listRoutines
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Routine page from Routine Service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutinePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutineCreate' }
      responses:
        '201':
          description: Routine created by Routine Service.
          headers:
            Location: { required: true, schema: { type: string, format: uri-reference } }
            ETag: { required: true, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/routines/{routineId}:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
    get:
      operationId: getRoutine
      responses:
        '200':
          description: Routine from Routine Service.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      operationId: updateRoutine
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/RoutinePatch' }
      responses:
        '200':
          description: Updated routine.
          headers:
            ETag: { required: true, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: archiveRoutine
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Routine archived. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/routines/{routineId}/sessions:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
    post:
      operationId: addSession
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '201':
          description: Session created.
          headers:
            ETag: { required: true, schema: { type: string } }
            Location: { required: true, schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/routines/{routineId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      responses:
        '200':
          description: Session prescription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: replaceSession
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWrite' }
      responses:
        '200':
          description: Session replaced.
          headers:
            ETag: { required: true, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Session deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/routines/{routineId}/sessions/{sessionId}/view:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSessionView
      summary: Compose a session prescription and recent exercise history.
      parameters:
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: Session view composed from Routine Service exercise-records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/routines/{routineId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/RoutineId'
    get:
      operationId: listSnapshots
      responses:
        '200':
          description: Up to two routine snapshots.
          content:
            application/json:
              schema:
                type: array
                maxItems: 2
                items: { $ref: '#/components/schemas/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: captureSnapshot
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201':
          description: Snapshot captured.
          headers:
            ETag: { required: true, schema: { type: string } }
            Location: { required: true, schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/exercise-logs:
    get:
      operationId: listExerciseLogs
      parameters:
        - name: exerciseName
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [loggedAt, highestSetVolume], default: loggedAt }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Exercise log page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createExerciseLog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExerciseLogRequest' }
      responses:
        '201':
          description: Exercise log created.
          headers:
            Location: { required: true, schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/exercises:
    get:
      operationId: listExercises
      summary: List distinct exercise names from the user's log history.
      responses:
        '200':
          description: Distinct exercises.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExerciseSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoutineId:
      name: routineId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    HistoryLimit:
      name: historyLimit
      in: query
      schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
  schemas:
    RoutineCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    RoutinePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    Routine:
      type: object
      required: [id, name, version, createdAt, updatedAt, sessions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/Session' }
    RoutinePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, version, createdAt, updatedAt]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              notes: { type: [string, 'null'] }
              version: { type: integer }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
              archivedAt: { type: [string, 'null'], format: date-time }
        nextCursor: { type: [string, 'null'] }
    SessionWrite:
      type: object
      additionalProperties: false
      required: [name, position, exercises]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        position: { type: integer, minimum: 0 }
        exercises:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ExercisePrescription' }
    Session:
      type: object
      required: [id, name, position, exercises]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        exercises:
          type: array
          items: { $ref: '#/components/schemas/ExercisePrescription' }
    ExercisePrescription:
      type: object
      required: [name, sets, repetitions, weightKg]
      properties:
        name: { type: string }
        sets: { type: integer }
        repetitions: { type: integer }
        weightKg: { type: number }
    Snapshot:
      type: object
      required: [id, capturedAt, entries]
      properties:
        id: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
        entries:
          type: array
          items:
            type: object
            required: [name, sets, repetitions, weightKg, repetitionsProgress, weightProgress]
            properties:
              name: { type: string }
              sets: { type: integer }
              repetitions: { type: integer }
              weightKg: { type: number }
              repetitionsProgress: { type: string, enum: [first, increased, decreased, same] }
              weightProgress: { type: string, enum: [first, increased, decreased, same] }
    SessionView:
      type: object
      required: [routineId, session, exerciseHistory]
      properties:
        routineId: { type: string, format: uuid }
        session: { $ref: '#/components/schemas/Session' }
        exerciseHistory:
          type: array
          items: { $ref: '#/components/schemas/ExerciseHistoryByName' }
    ExerciseHistoryByName:
      type: object
      required: [exerciseName, logs]
      properties:
        exerciseName: { type: string }
        logs:
          type: array
          items: { $ref: '#/components/schemas/ExerciseLog' }
    CreateExerciseLogRequest:
      type: object
      additionalProperties: false
      required: [exerciseName, sets]
      properties:
        exerciseName: { type: string, minLength: 1, maxLength: 120 }
        loggedAt: { type: string, format: date-time }
        sets:
          type: array
          minItems: 1
          items:
            type: object
            required: [setNumber, weightKg, reps]
            properties:
              setNumber: { type: integer, minimum: 1 }
              weightKg: { type: number, minimum: 0, multipleOf: 0.01 }
              reps: { type: integer, minimum: 1 }
    ExerciseLog:
      type: object
      required: [id, exerciseName, loggedAt, sets, highestSetVolumeKg]
      properties:
        id: { type: integer, format: int64 }
        exerciseName: { type: string }
        loggedAt: { type: string, format: date-time }
        sets:
          type: array
          items:
            type: object
            required: [id, setNumber, weightKg, reps, volumeKg]
            properties:
              id: { type: integer, format: int64 }
              setNumber: { type: integer }
              weightKg: { type: number }
              reps: { type: integer }
              volumeKg: { type: number }
        highestSetVolumeKg: { type: number }
    ExerciseLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExerciseLog' }
        nextCursor: { type: [string, 'null'] }
    ExerciseSummary:
      type: object
      required: [exerciseName, logCount, lastLoggedAt]
      properties:
        exerciseName: { type: string }
        logCount: { type: integer }
        lastLoggedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid, expired, or unacceptable access token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or inaccessible.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Domain conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: ETag precondition failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: If-Match is required.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: Downstream response invalid or contract-incompatible.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Required downstream service unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
